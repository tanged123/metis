name: Code Coverage

on: push

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v20
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Run Coverage Script
      run: nix develop --command ./scripts/coverage.sh

    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/coverage/coverage_clean.info
        # Pin uploader: Codecov's "latest" CDN periodically serves a binary
        # whose hash disagrees with the signed SHA256SUM manifest, causing
        # the wrapper's integrity check to fail. Pin to a known-good
        # version. Bump when a new release is confirmed in sync.
        version: v11.2.7
        fail_ci_if_error: true
